version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: planning-poker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planningpoker
      POSTGRES_PASSWORD: planningpoker_dev
      POSTGRES_DB: planningpoker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planningpoker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
